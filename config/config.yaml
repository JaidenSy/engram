engram:
  name: "Engram"
  session_prefix: "engram"
  log_path: "/Users/raphael_the_great-sage/engram/logs/engram.log"

# Telegram is the only supported trigger (see engram.py main()).
trigger:
  method: "telegram"

  telegram:
    # NOTE: token was migrated to keychain service "engram-telegram-bot"; the old
    # "engram-telegram-bot" entry is left as a harmless fallback.
    bot_token_keychain_service: "engram-telegram-bot"
    bot_token_keychain_account: "bot-token"
    chat_id: 8922766986
    trigger_prefix: "[ENGRAM]"
    poll_interval_seconds: 15

models:
  # ── Agent model routing (READ BY agent_runner.py — injected into task JSON,
  # consumed by run-agent.sh). Aliases (haiku/sonnet/opus/fable) always resolve
  # to the latest model of that tier via the claude CLI. Unavailable aliases are
  # auto-downgraded at startup by agent_runner.probe_models() (fable→opus→…).
  #
  # Routing philosophy:
  #   haiku  → mechanical steps (gather, polish, run a gh command)
  #   sonnet → the workhorse (writing code, writing tests, planning)
  #   opus   → judgment steps where a miss is expensive (review, architecture)
  #   fable  → tier-3 only: deepest reasoning for system design + final review
  agent_models:
    # Direct tasks (status checks / lookups — no pipeline).
    # sonnet, not haiku: the classifier sometimes routes real work here and haiku
    # bounces on anything non-trivial (e.g. asks for a URL and quits).
    direct:
      model: "sonnet"
      max_turns: 30

    # Per-role defaults (all tiers)
    roles:
      plan:      { model: "sonnet", max_turns: 25 }   # plan quality gates the whole run
      research:  { model: "haiku",  max_turns: 20 }
      architect: { model: "opus",   max_turns: 40 }
      coder:     { model: "sonnet", max_turns: 60 }
      tester:    { model: "sonnet", max_turns: 30 }
      cleanup:   { model: "haiku",  max_turns: 15 }
      review:    { model: "opus",   max_turns: 35 }   # highest-leverage catch point
      deployer:  { model: "haiku",  max_turns: 10 }

    # Per-tier overrides (tier 3 = architecture work → strongest models
    # on the steps that decide everything downstream)
    tier_overrides:
      1:
        coder:   { model: "sonnet", max_turns: 40 }   # hotfix — smaller scope
        tester:  { model: "haiku",  max_turns: 20 }
      3:
        plan:      { model: "opus",  max_turns: 30 }
        architect: { model: "fable", max_turns: 40 }
        review:    { model: "fable", max_turns: 35 }

# ── Per-run isolation (worktree.py) ─────────────────────────────────────────
# Each pipeline run gets its own checkout:
#   git worktree add <repo>/.engram-worktrees/<run_id> -b <branch> origin/<pr_base>
# Every step runs there; it is removed on done/failed/aborted (branch kept,
# uncommitted leftovers stashed). Orphans are swept at daemon startup.
worktrees:
  enabled: true
  root: ""            # "" → <repo>/.engram-worktrees; else <root>/<repo-name>/<run_id>

runs:
  # One active run at a time. Worktrees make concurrent runs possible, but
  # abort/status still assume one live run, so keep this on for now.
  # Forced on whenever worktrees.enabled is false.
  single_active_run: true

# ── Tracing / telemetry (tracing.py) ────────────────────────────────────────
# Every run is a W3C trace; every step's `claude -p` gets
# TRACEPARENT=00-<run trace_id>-<step span_id>-01, so Claude Code's own spans
# (when its telemetry is on) parent under the run. trace_id lands in the run
# JSON and ledger.jsonl.
telemetry:
  propagate_traceparent: true
  claude_code:
    enabled: false              # → CLAUDE_CODE_ENABLE_TELEMETRY=1 + OTEL_{METRICS,LOGS}_EXPORTER
    enhanced_traces_beta: false # → CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 + OTEL_TRACES_EXPORTER
    otlp_endpoint: ""           # → OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://localhost:4318
    otlp_protocol: "http/protobuf"
    metrics_exporter: "otlp"
    logs_exporter: "otlp"
    traces_exporter: "otlp"
    resource_attributes: ""     # appended to OTEL_RESOURCE_ATTRIBUTES (engram.run_id/role always set)
    extra_env: {}               # any other non-secret env for the agent process
  # Names of env vars copied from the daemon's environment into the agent's tmux
  # session only (never written to the task JSON). Use for secrets, e.g.
  # OTEL_EXPORTER_OTLP_HEADERS.
  passthrough_env: []
  # Emit Engram's own invoke_workflow / invoke_agent spans. Needs
  # `pip install opentelemetry-sdk opentelemetry-exporter-otlp`; silently off without it.
  engram_spans: false
